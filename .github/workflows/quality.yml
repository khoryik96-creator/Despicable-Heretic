name: Quality Gate

on:
  push:
    branches: [main, architecture-v2]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate manuscript and canon
        run: npm run validate

      - name: Lint
        run: npm run lint

      - name: Type-check and build exact Pages artifact
        run: npm run build:pages

      - name: Install Chromium for reader smoke tests
        run: npx playwright install --with-deps chromium

      - name: Browser-test production root and rollback reader
        run: npm run test:reader
